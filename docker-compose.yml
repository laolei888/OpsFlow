x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  storage-init:
    image: opsflow-app:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /app/uploads /app/logs"]
    volumes:
      - opsflow_uploads:/app/uploads
      - opsflow_logs:/app/logs
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"
    logging: *default-logging

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opsflow}
      MYSQL_USER: ${MYSQL_USER:-opsflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opsflow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - opsflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - opsflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-opsflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-opsflow}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - opsflow_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  object-storage:
    image: rustfs/rustfs:1.0.3
    profiles: ["object-storage"]
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${OPSFLOW_STORAGE_S3_ACCESS_KEY:-opsflow}
      RUSTFS_SECRET_KEY: ${OPSFLOW_STORAGE_S3_SECRET_KEY:-opsflow-object-storage-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - opsflow_object_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  app:
    build: .
    image: opsflow-app:latest
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-opsflow}
      DB_USERNAME: ${MYSQL_USER:-opsflow}
      DB_PASSWORD: ${MYSQL_PASSWORD:-opsflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-opsflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-opsflow}
      JWT_SECRET: ${JWT_SECRET:-opsflow-local-only-signing-key-change-before-sharing-2026}
      OPSFLOW_BACKUP_AGENT_SECRET_KEY: ${OPSFLOW_BACKUP_AGENT_SECRET_KEY:-opsflow-local-backup-agent-secret-key-change-me}
      OPSFLOW_BACKUP_AGENT_SIGNATURE_TOLERANCE: ${OPSFLOW_BACKUP_AGENT_SIGNATURE_TOLERANCE:-PT5M}
      OPSFLOW_REGISTRATION_ENABLED: ${OPSFLOW_REGISTRATION_ENABLED:-true}
      OPSFLOW_CORS_ALLOWED_ORIGINS: ${OPSFLOW_CORS_ALLOWED_ORIGINS:-}
      OPSFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS: ${OPSFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS:-false}
      OPSFLOW_OUTBOUND_ALLOWED_HOSTS: ${OPSFLOW_OUTBOUND_ALLOWED_HOSTS:-}
      OPSFLOW_NOTIFICATION_EMAIL_ENABLED: ${OPSFLOW_NOTIFICATION_EMAIL_ENABLED:-false}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${OPSFLOW_NOTIFICATION_EMAIL_ENABLED:-false}
      OPSFLOW_NOTIFICATION_EMAIL_FROM: ${OPSFLOW_NOTIFICATION_EMAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      OPSFLOW_ATTACHMENT_CLAMAV_ENABLED: ${OPSFLOW_ATTACHMENT_CLAMAV_ENABLED:-false}
      OPSFLOW_ATTACHMENT_CLAMAV_HOST: ${OPSFLOW_ATTACHMENT_CLAMAV_HOST:-clamav}
      OPSFLOW_ATTACHMENT_CLAMAV_PORT: ${OPSFLOW_ATTACHMENT_CLAMAV_PORT:-3310}
      OPSFLOW_ATTACHMENT_CLAMAV_TIMEOUT_MS: ${OPSFLOW_ATTACHMENT_CLAMAV_TIMEOUT_MS:-5000}
      OPSFLOW_ATTACHMENT_ARCHIVE_MAX_ENTRIES: ${OPSFLOW_ATTACHMENT_ARCHIVE_MAX_ENTRIES:-2000}
      OPSFLOW_ATTACHMENT_ARCHIVE_MAX_EXPANDED_BYTES: ${OPSFLOW_ATTACHMENT_ARCHIVE_MAX_EXPANDED_BYTES:-104857600}
      OPSFLOW_ATTACHMENT_ARCHIVE_MAX_RATIO: ${OPSFLOW_ATTACHMENT_ARCHIVE_MAX_RATIO:-100}
      OPSFLOW_STORAGE_TYPE: ${OPSFLOW_STORAGE_TYPE:-LOCAL}
      OPSFLOW_STORAGE_PRESIGNED_TTL: ${OPSFLOW_STORAGE_PRESIGNED_TTL:-PT5M}
      OPSFLOW_STORAGE_S3_ENABLED: ${OPSFLOW_STORAGE_S3_ENABLED:-false}
      OPSFLOW_STORAGE_S3_ENDPOINT: ${OPSFLOW_STORAGE_S3_ENDPOINT:-http://object-storage:9000}
      OPSFLOW_STORAGE_S3_PUBLIC_ENDPOINT: ${OPSFLOW_STORAGE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      OPSFLOW_STORAGE_S3_REGION: ${OPSFLOW_STORAGE_S3_REGION:-us-east-1}
      OPSFLOW_STORAGE_S3_ACCESS_KEY: ${OPSFLOW_STORAGE_S3_ACCESS_KEY:-opsflow}
      OPSFLOW_STORAGE_S3_SECRET_KEY: ${OPSFLOW_STORAGE_S3_SECRET_KEY:-opsflow-object-storage-local-password}
      OPSFLOW_STORAGE_S3_BUCKET: ${OPSFLOW_STORAGE_S3_BUCKET:-opsflow-attachments}
      OPSFLOW_STORAGE_S3_PATH_STYLE: ${OPSFLOW_STORAGE_S3_PATH_STYLE:-true}
      OPSFLOW_STORAGE_S3_AUTO_CREATE_BUCKET: ${OPSFLOW_STORAGE_S3_AUTO_CREATE_BUCKET:-true}
      OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_CORS: ${OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_CORS:-true}
      OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_VERSIONING: ${OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_VERSIONING:-true}
      OPSFLOW_STORAGE_S3_CORS_ALLOWED_ORIGINS: ${OPSFLOW_STORAGE_S3_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      OPSFLOW_STORAGE_MULTIPART_ENABLED: ${OPSFLOW_STORAGE_MULTIPART_ENABLED:-true}
      OPSFLOW_STORAGE_MULTIPART_PART_SIZE: ${OPSFLOW_STORAGE_MULTIPART_PART_SIZE:-8388608}
      OPSFLOW_STORAGE_MULTIPART_MAX_FILE_SIZE: ${OPSFLOW_STORAGE_MULTIPART_MAX_FILE_SIZE:-1073741824}
      OPSFLOW_STORAGE_MULTIPART_PRESIGNED_TTL: ${OPSFLOW_STORAGE_MULTIPART_PRESIGNED_TTL:-PT15M}
      OPSFLOW_STORAGE_MULTIPART_SESSION_TTL: ${OPSFLOW_STORAGE_MULTIPART_SESSION_TTL:-PT24H}
      OPSFLOW_STORAGE_MULTIPART_RETENTION_DAYS: ${OPSFLOW_STORAGE_MULTIPART_RETENTION_DAYS:-7}
      OPSFLOW_STORAGE_GOVERNANCE_ENABLED: ${OPSFLOW_STORAGE_GOVERNANCE_ENABLED:-true}
      OPSFLOW_STORAGE_DEFAULT_QUOTA_BYTES: ${OPSFLOW_STORAGE_DEFAULT_QUOTA_BYTES:-10737418240}
      OPSFLOW_STORAGE_DEFAULT_WARNING_PERCENT: ${OPSFLOW_STORAGE_DEFAULT_WARNING_PERCENT:-80}
      OPSFLOW_STORAGE_ORPHAN_GRACE_PERIOD: ${OPSFLOW_STORAGE_ORPHAN_GRACE_PERIOD:-PT24H}
      OPSFLOW_STORAGE_MAX_OBJECTS_PER_SCAN: ${OPSFLOW_STORAGE_MAX_OBJECTS_PER_SCAN:-10000}
      OPSFLOW_APP_VERSION: ${OPSFLOW_APP_VERSION:-local}
      OPSFLOW_CAPACITY_CAPTURE_INTERVAL_MS: ${OPSFLOW_CAPACITY_CAPTURE_INTERVAL_MS:-3600000}
      OPSFLOW_CAPACITY_RETENTION_DAYS: ${OPSFLOW_CAPACITY_RETENTION_DAYS:-180}
      OPSFLOW_CAPACITY_ACTIVE_TICKETS: ${OPSFLOW_CAPACITY_ACTIVE_TICKETS:-5000}
      OPSFLOW_CAPACITY_OVERDUE_TICKETS: ${OPSFLOW_CAPACITY_OVERDUE_TICKETS:-500}
      OPSFLOW_CAPACITY_ACTIVE_INCIDENTS: ${OPSFLOW_CAPACITY_ACTIVE_INCIDENTS:-20}
      OPSFLOW_CAPACITY_FIRING_ALERTS: ${OPSFLOW_CAPACITY_FIRING_ALERTS:-100}
      OPSFLOW_CAPACITY_ASYNC_BACKLOG: ${OPSFLOW_CAPACITY_ASYNC_BACKLOG:-1000}
      OPSFLOW_CAPACITY_ATTACHMENT_BACKLOG: ${OPSFLOW_CAPACITY_ATTACHMENT_BACKLOG:-500}
      OPSFLOW_CAPACITY_ATTACHMENT_BYTES: ${OPSFLOW_CAPACITY_ATTACHMENT_BYTES:-5368709120}
      OPSFLOW_CAPACITY_DATABASE_BYTES: ${OPSFLOW_CAPACITY_DATABASE_BYTES:-10737418240}
      # Optional local demo account. Configure username and password together.
      OPSFLOW_BOOTSTRAP_USERNAME: ${OPSFLOW_BOOTSTRAP_USERNAME:-}
      OPSFLOW_BOOTSTRAP_PASSWORD: ${OPSFLOW_BOOTSTRAP_PASSWORD:-}
      OPSFLOW_BOOTSTRAP_DISPLAY_NAME: ${OPSFLOW_BOOTSTRAP_DISPLAY_NAME:-OpsFlow 客服}
      OPSFLOW_BOOTSTRAP_ROLE: ${OPSFLOW_BOOTSTRAP_ROLE:-AGENT}
      OPSFLOW_BOOTSTRAP_TENANT_ID: ${OPSFLOW_BOOTSTRAP_TENANT_ID:-1}
    ports:
      - "8081:8080"
    volumes:
      - opsflow_uploads:/app/uploads
    init: true
    logging: *default-logging

  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    volumes:
      - opsflow_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *default-logging

  k6:
    image: grafana/k6:2.2.0
    profiles: ["quality"]
    depends_on:
      app:
        condition: service_started
    environment:
      OPSFLOW_BASE_URL: http://app:8080
    volumes:
      - ./quality/k6:/scripts:ro
    command: ["run", "--summary-mode=full", "/scripts/opsflow-smoke.js"]
    logging: *default-logging

volumes:
  opsflow_mysql:
  opsflow_redis:
  opsflow_rabbitmq:

  opsflow_uploads:
  opsflow_logs:
  opsflow_clamav:
  opsflow_object_storage:
