x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  storage-init:
    image: opsflow-app:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /app/uploads /app/logs"]
    volumes:
      - opsflow_uploads:/app/uploads
      - opsflow_logs:/app/logs
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"
    logging: *default-logging

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opsflow}
      MYSQL_USER: ${MYSQL_USER:-opsflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opsflow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - opsflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - opsflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-opsflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-opsflow}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - opsflow_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  app:
    build: .
    image: opsflow-app:latest
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-opsflow}
      DB_USERNAME: ${MYSQL_USER:-opsflow}
      DB_PASSWORD: ${MYSQL_PASSWORD:-opsflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-opsflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-opsflow}
      JWT_SECRET: ${JWT_SECRET:-opsflow-local-only-signing-key-change-before-sharing-2026}
      OPSFLOW_REGISTRATION_ENABLED: ${OPSFLOW_REGISTRATION_ENABLED:-true}
      OPSFLOW_CORS_ALLOWED_ORIGINS: ${OPSFLOW_CORS_ALLOWED_ORIGINS:-}
      OPSFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS: ${OPSFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS:-false}
      OPSFLOW_OUTBOUND_ALLOWED_HOSTS: ${OPSFLOW_OUTBOUND_ALLOWED_HOSTS:-}
      OPSFLOW_NOTIFICATION_EMAIL_ENABLED: ${OPSFLOW_NOTIFICATION_EMAIL_ENABLED:-false}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${OPSFLOW_NOTIFICATION_EMAIL_ENABLED:-false}
      OPSFLOW_NOTIFICATION_EMAIL_FROM: ${OPSFLOW_NOTIFICATION_EMAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      # Optional local demo account. Configure username and password together.
      OPSFLOW_BOOTSTRAP_USERNAME: ${OPSFLOW_BOOTSTRAP_USERNAME:-}
      OPSFLOW_BOOTSTRAP_PASSWORD: ${OPSFLOW_BOOTSTRAP_PASSWORD:-}
      OPSFLOW_BOOTSTRAP_DISPLAY_NAME: ${OPSFLOW_BOOTSTRAP_DISPLAY_NAME:-OpsFlow 客服}
      OPSFLOW_BOOTSTRAP_ROLE: ${OPSFLOW_BOOTSTRAP_ROLE:-AGENT}
      OPSFLOW_BOOTSTRAP_TENANT_ID: ${OPSFLOW_BOOTSTRAP_TENANT_ID:-1}
    ports:
      - "8081:8080"
    volumes:
      - opsflow_uploads:/app/uploads
    init: true
    logging: *default-logging

  k6:
    image: grafana/k6:2.2.0
    profiles: ["quality"]
    depends_on:
      app:
        condition: service_started
    environment:
      OPSFLOW_BASE_URL: http://app:8080
    volumes:
      - ./quality/k6:/scripts:ro
    command: ["run", "--summary-mode=full", "/scripts/opsflow-smoke.js"]
    logging: *default-logging

volumes:
  opsflow_mysql:
  opsflow_redis:
  opsflow_rabbitmq:

  opsflow_uploads:
  opsflow_logs:
