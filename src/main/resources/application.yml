server:
  port: 8080

spring:
  application:
    name: opsflow
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opsflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:opsflow}
    password: ${DB_PASSWORD:opsflow}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:opsflow}
    password: ${RABBITMQ_PASSWORD:opsflow}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 5
          max-interval: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted

management:
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: ${OPSFLOW_NOTIFICATION_EMAIL_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${OPSFLOW_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${OPSFLOW_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OPSFLOW_TRACING_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${OPSFLOW_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OPSFLOW_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: 5s

logging:
  file:
    name: ${OPSFLOW_LOG_PATH:}
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} requestId=%X{opsflow.requestId:-}] "

springdoc:
  api-docs:
    enabled: ${OPSFLOW_API_DOCS_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${OPSFLOW_API_DOCS_ENABLED:true}
    path: /docs
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true

security:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT2H}

opsflow:
  security:
    registration-enabled: ${OPSFLOW_REGISTRATION_ENABLED:true}
    public-metrics: ${OPSFLOW_PUBLIC_METRICS:true}
    cors-allowed-origins: ${OPSFLOW_CORS_ALLOWED_ORIGINS:}
    login-protection:
      max-failures: ${OPSFLOW_LOGIN_MAX_FAILURES:5}
      observation-window: ${OPSFLOW_LOGIN_OBSERVATION_WINDOW:PT15M}
      lock-duration: ${OPSFLOW_LOGIN_LOCK_DURATION:PT15M}
    rate-limit:
      login-attempts: ${OPSFLOW_LOGIN_RATE_LIMIT:10}
      login-window: ${OPSFLOW_LOGIN_RATE_WINDOW:PT1M}
      registration-attempts: ${OPSFLOW_REGISTRATION_RATE_LIMIT:5}
      registration-window: ${OPSFLOW_REGISTRATION_RATE_WINDOW:PT1H}
      write-requests: ${OPSFLOW_WRITE_RATE_LIMIT:60}
      write-window: ${OPSFLOW_WRITE_RATE_WINDOW:PT1M}
      alert-ingest-requests: ${OPSFLOW_ALERT_INGEST_RATE_LIMIT:300}
      alert-ingest-window: ${OPSFLOW_ALERT_INGEST_RATE_WINDOW:PT1M}
    outbound-requests:
      allow-http: ${OPSFLOW_OUTBOUND_ALLOW_HTTP:true}
      allow-private-networks: ${OPSFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS:false}
      allowed-hosts: ${OPSFLOW_OUTBOUND_ALLOWED_HOSTS:}
  observability:
    slow-request-threshold: ${OPSFLOW_SLOW_REQUEST_THRESHOLD:500ms}
  bootstrap:
    username: ${OPSFLOW_BOOTSTRAP_USERNAME:}
    password: ${OPSFLOW_BOOTSTRAP_PASSWORD:}
    display-name: ${OPSFLOW_BOOTSTRAP_DISPLAY_NAME:OpsFlow 客服}
    role: ${OPSFLOW_BOOTSTRAP_ROLE:AGENT}
    tenant-id: ${OPSFLOW_BOOTSTRAP_TENANT_ID:1}
  sla:
    scan-interval-ms: 300000
    initial-delay-ms: 15000
  idempotency:
    retention-hours: 24
    cleanup-interval-ms: 3600000
    initial-delay-ms: 60000
  webhook:
    delivery-interval-ms: 15000
    initial-delay-ms: 20000
  messaging:
    outbox-interval-ms: ${OPSFLOW_MESSAGING_OUTBOX_INTERVAL_MS:5000}
    initial-delay-ms: ${OPSFLOW_MESSAGING_INITIAL_DELAY_MS:10000}
    publish-confirm-timeout: ${OPSFLOW_MESSAGING_CONFIRM_TIMEOUT:5s}
    consumer-concurrency: ${OPSFLOW_MESSAGING_CONSUMER_CONCURRENCY:2}
    dead-letter-concurrency: ${OPSFLOW_MESSAGING_DEAD_LETTER_CONCURRENCY:1}
  notification:
    delivery-interval-ms: ${OPSFLOW_NOTIFICATION_DELIVERY_INTERVAL_MS:10000}
    initial-delay-ms: ${OPSFLOW_NOTIFICATION_INITIAL_DELAY_MS:15000}
    email:
      enabled: ${OPSFLOW_NOTIFICATION_EMAIL_ENABLED:false}
      from: ${OPSFLOW_NOTIFICATION_EMAIL_FROM:}
  storage:
    upload-dir: ${OPSFLOW_UPLOAD_DIR:/app/uploads}
    max-file-size: ${OPSFLOW_MAX_UPLOAD_BYTES:10485760}
