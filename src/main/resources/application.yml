server:
  port: 8080

spring:
  application:
    name: opsflow
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opsflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:opsflow}
    password: ${DB_PASSWORD:opsflow}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${OPSFLOW_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
  tracing:
    enabled: ${OPSFLOW_TRACING_ENABLED:false}
    sampling:
      probability: ${OPSFLOW_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OPSFLOW_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${OPSFLOW_ENVIRONMENT:local}

logging:
  file:
    name: ${OPSFLOW_LOG_PATH:}
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} requestId=%X{opsflow.requestId:-}] "

springdoc:
  api-docs:
    enabled: ${OPSFLOW_API_DOCS_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${OPSFLOW_API_DOCS_ENABLED:true}
    path: /docs
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true

security:
  jwt:
    secret: ${JWT_SECRET:opsflow-development-secret-change-me-please-2026}
    ttl: PT2H

opsflow:
  observability:
    slow-request-threshold: ${OPSFLOW_SLOW_REQUEST_THRESHOLD:500ms}
  bootstrap:
    username: ${OPSFLOW_BOOTSTRAP_USERNAME:}
    password: ${OPSFLOW_BOOTSTRAP_PASSWORD:}
    display-name: ${OPSFLOW_BOOTSTRAP_DISPLAY_NAME:OpsFlow 客服}
    role: ${OPSFLOW_BOOTSTRAP_ROLE:AGENT}
    tenant-id: ${OPSFLOW_BOOTSTRAP_TENANT_ID:1}
  sla:
    scan-interval-ms: 300000
    initial-delay-ms: 15000
  idempotency:
    retention-hours: 24
    cleanup-interval-ms: 3600000
    initial-delay-ms: 60000
  webhook:
    delivery-interval-ms: 15000
    initial-delay-ms: 20000
  storage:
    upload-dir: ${OPSFLOW_UPLOAD_DIR:/app/uploads}
    max-file-size: 10485760
