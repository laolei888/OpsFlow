spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      password: ${REDIS_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}

opsflow:
  recovery:
    backup-agent:
      encryption-key: ${OPSFLOW_BACKUP_AGENT_SECRET_KEY}
      signature-tolerance: ${OPSFLOW_BACKUP_AGENT_SIGNATURE_TOLERANCE:PT5M}
  security:
    registration-enabled: false
    public-metrics: false
    outbound-requests:
      allow-http: false
      allow-private-networks: false
