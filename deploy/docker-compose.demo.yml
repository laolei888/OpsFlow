name: opsflow-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  storage-init:
    image: ghcr.io/laolei888/opsflow:${OPSFLOW_IMAGE_TAG:-main}
    pull_policy: always
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /app/uploads"]
    volumes:
      - uploads:/app/uploads
    networks: [backend]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"
    logging: *default-logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opsflow}
      MYSQL_USER: ${MYSQL_USER:-opsflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.2-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-opsflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  app:
    image: ghcr.io/laolei888/opsflow:${OPSFLOW_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-opsflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-opsflow}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-opsflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OPSFLOW_REGISTRATION_ENABLED: "false"
      OPSFLOW_API_DOCS_ENABLED: "false"
      OPSFLOW_PUBLIC_METRICS: "false"
      OPSFLOW_CORS_ALLOWED_ORIGINS: ${OPSFLOW_CORS_ALLOWED_ORIGINS:?set OPSFLOW_CORS_ALLOWED_ORIGINS}
      OPSFLOW_OUTBOUND_ALLOW_HTTP: "false"
      OPSFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS: "false"
      OPSFLOW_STORAGE_TYPE: ${OPSFLOW_STORAGE_TYPE:-LOCAL}
      OPSFLOW_STORAGE_PRESIGNED_TTL: ${OPSFLOW_STORAGE_PRESIGNED_TTL:-PT5M}
      OPSFLOW_STORAGE_S3_ENABLED: ${OPSFLOW_STORAGE_S3_ENABLED:-false}
      OPSFLOW_STORAGE_S3_ENDPOINT: ${OPSFLOW_STORAGE_S3_ENDPOINT:-}
      OPSFLOW_STORAGE_S3_PUBLIC_ENDPOINT: ${OPSFLOW_STORAGE_S3_PUBLIC_ENDPOINT:-}
      OPSFLOW_STORAGE_S3_REGION: ${OPSFLOW_STORAGE_S3_REGION:-us-east-1}
      OPSFLOW_STORAGE_S3_ACCESS_KEY: ${OPSFLOW_STORAGE_S3_ACCESS_KEY:-}
      OPSFLOW_STORAGE_S3_SECRET_KEY: ${OPSFLOW_STORAGE_S3_SECRET_KEY:-}
      OPSFLOW_STORAGE_S3_BUCKET: ${OPSFLOW_STORAGE_S3_BUCKET:-opsflow-attachments}
      OPSFLOW_STORAGE_S3_PATH_STYLE: ${OPSFLOW_STORAGE_S3_PATH_STYLE:-true}
      OPSFLOW_STORAGE_S3_AUTO_CREATE_BUCKET: ${OPSFLOW_STORAGE_S3_AUTO_CREATE_BUCKET:-false}
      OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_CORS: ${OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_CORS:-false}
      OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_VERSIONING: ${OPSFLOW_STORAGE_S3_AUTO_CONFIGURE_VERSIONING:-false}
      OPSFLOW_STORAGE_S3_CORS_ALLOWED_ORIGINS: ${OPSFLOW_STORAGE_S3_CORS_ALLOWED_ORIGINS:-}
      OPSFLOW_STORAGE_MULTIPART_ENABLED: ${OPSFLOW_STORAGE_MULTIPART_ENABLED:-true}
      OPSFLOW_STORAGE_MULTIPART_PART_SIZE: ${OPSFLOW_STORAGE_MULTIPART_PART_SIZE:-8388608}
      OPSFLOW_STORAGE_MULTIPART_MAX_FILE_SIZE: ${OPSFLOW_STORAGE_MULTIPART_MAX_FILE_SIZE:-1073741824}
      OPSFLOW_STORAGE_MULTIPART_PRESIGNED_TTL: ${OPSFLOW_STORAGE_MULTIPART_PRESIGNED_TTL:-PT15M}
      OPSFLOW_STORAGE_MULTIPART_SESSION_TTL: ${OPSFLOW_STORAGE_MULTIPART_SESSION_TTL:-PT24H}
      OPSFLOW_STORAGE_MULTIPART_RETENTION_DAYS: ${OPSFLOW_STORAGE_MULTIPART_RETENTION_DAYS:-7}
      OPSFLOW_STORAGE_GOVERNANCE_ENABLED: ${OPSFLOW_STORAGE_GOVERNANCE_ENABLED:-true}
      OPSFLOW_STORAGE_DEFAULT_QUOTA_BYTES: ${OPSFLOW_STORAGE_DEFAULT_QUOTA_BYTES:-10737418240}
      OPSFLOW_STORAGE_DEFAULT_WARNING_PERCENT: ${OPSFLOW_STORAGE_DEFAULT_WARNING_PERCENT:-80}
      OPSFLOW_STORAGE_ORPHAN_GRACE_PERIOD: ${OPSFLOW_STORAGE_ORPHAN_GRACE_PERIOD:-PT24H}
      OPSFLOW_STORAGE_MAX_OBJECTS_PER_SCAN: ${OPSFLOW_STORAGE_MAX_OBJECTS_PER_SCAN:-10000}
      OPSFLOW_BOOTSTRAP_USERNAME: ${OPSFLOW_BOOTSTRAP_USERNAME:-}
      OPSFLOW_BOOTSTRAP_PASSWORD: ${OPSFLOW_BOOTSTRAP_PASSWORD:-}
      OPSFLOW_BOOTSTRAP_DISPLAY_NAME: ${OPSFLOW_BOOTSTRAP_DISPLAY_NAME:-OpsFlow 管理员}
      OPSFLOW_BOOTSTRAP_ROLE: ${OPSFLOW_BOOTSTRAP_ROLE:-ADMIN}
      OPSFLOW_BOOTSTRAP_TENANT_ID: ${OPSFLOW_BOOTSTRAP_TENANT_ID:-1}
    ports:
      - "${OPSFLOW_HTTP_PORT:-8081}:8080"
    volumes:
      - uploads:/app/uploads
    networks: [edge, backend]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  uploads:
