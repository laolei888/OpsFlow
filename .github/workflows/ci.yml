name: OpsFlow CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: opsflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  container:
    name: Reproducible container build
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: opsflow-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start application stack
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --no-build
      - name: Smoke test health and OpenAPI
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker-compose.yml -f docker-compose.observability.yml logs app tempo
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://localhost:8081/
          curl --fail --silent --location --output /dev/null http://localhost:8081/docs
          curl --fail --silent http://localhost:8081/api-docs | grep -q '"title":"OpsFlow API"'
      - name: Verify OpenAPI contract
        run: node quality/openapi-contract.mjs
      - name: Verify runtime security baseline
        run: node quality/security-smoke.mjs
      - name: Verify metrics, traces and correlated logs
        run: node quality/observability-smoke.mjs
      - name: Run k6 performance baseline
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile quality run --rm --no-deps k6
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml down --volumes
